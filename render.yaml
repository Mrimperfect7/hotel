# Render Blueprint — deploys the API container (free tier works).
# Deploy: Render dashboard → New → Blueprint → point at this repo → Apply.
# Fill DATABASE_URL with your Neon/managed Postgres connection string when prompted.
services:
  - type: web
    name: namma-guruvayoor-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # you paste your Neon/Postgres URL in the dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: http://localhost:3000 # change to your deployed web URL
      - key: PAYMENT_MOCK
        value: "1" # switch to "0" after adding real Razorpay keys
      - key: NODE_ENV
        value: production
